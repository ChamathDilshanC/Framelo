<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1304" viewBox="0 0 600 1304">
<!-- Original placeholder finance dashboard for the Emerald Finance Showcase.
     Replaceable through Screen media: upload a PNG, JPG, WebP, MP4 or WebM. -->
<defs>
  <linearGradient id="e-bg" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#062c20"/><stop offset=".42" stop-color="#04211a"/><stop offset="1" stop-color="#010c0a"/></linearGradient>
  <radialGradient id="e-halo" cx=".78" cy=".12" r=".7"><stop stop-color="#1f9f68" stop-opacity=".45"/><stop offset="1" stop-color="#1f9f68" stop-opacity="0"/></radialGradient>
  <linearGradient id="e-card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8f3e2"/><stop offset=".55" stop-color="#b9e6cd"/><stop offset="1" stop-color="#8fd6b0"/></linearGradient>
  <linearGradient id="e-cta" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#16a95c"/><stop offset="1" stop-color="#2fd07c"/></linearGradient>
  <linearGradient id="e-fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#010c0a" stop-opacity="0"/><stop offset="1" stop-color="#010c0a" stop-opacity=".92"/></linearGradient>
</defs>

<rect width="600" height="1304" fill="url(#e-bg)"/>
<rect width="600" height="1304" fill="url(#e-halo)"/>

<!-- subtle yellow / blue accent arcs, as in the reference -->
<g fill="none" stroke-linecap="round">
  <path d="M-30 214q210-150 402-46t258 22" stroke="#e8c765" stroke-opacity=".34" stroke-width="3"/>
  <path d="M-30 268q186-128 372-30t288 6" stroke="#5f9fe0" stroke-opacity=".26" stroke-width="3"/>
  <path d="M-30 322q160-96 336-16t314 2" stroke="#3fd08a" stroke-opacity=".2" stroke-width="3"/>
</g>

<!-- status bar -->
<g fill="#eaf7f0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="27" font-weight="600">
  <text x="52" y="66">09:41</text>
</g>
<g fill="#eaf7f0" opacity=".92">
  <rect x="432" y="47" width="5" height="12" rx="2"/><rect x="442" y="42" width="5" height="17" rx="2"/><rect x="452" y="37" width="5" height="22" rx="2"/><rect x="462" y="32" width="5" height="27" rx="2"/>
  <path d="M484 40a26 26 0 0 1 34 0" fill="none" stroke="#eaf7f0" stroke-width="4" stroke-linecap="round"/>
  <path d="M493 50a13 13 0 0 1 16 0" fill="none" stroke="#eaf7f0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="501" cy="58" r="3"/>
  <rect x="530" y="36" width="34" height="19" rx="6" fill="none" stroke="#eaf7f0" stroke-width="3"/><rect x="534" y="40" width="24" height="11" rx="3"/>
</g>
<rect x="228" y="24" width="144" height="42" rx="21" fill="#010705"/>
<circle cx="348" cy="45" r="8" fill="#0d2a22"/>

<!-- avatar + settings -->
<circle cx="92" cy="156" r="40" fill="#0e3b2c" stroke="#3ddc8c" stroke-opacity=".5" stroke-width="3"/>
<circle cx="92" cy="142" r="15" fill="#cfe9dc"/>
<path d="M64 186q28-26 56 0z" fill="#cfe9dc"/>
<g fill="none" stroke="#cfe9dc" stroke-width="4" stroke-opacity=".85">
  <circle cx="524" cy="156" r="14"/>
  <path d="M524 130v10m0 32v10m-26-26h10m32 0h10m-37-19 7 7m26 26 7 7m0-40-7 7m-26 26-7 7" stroke-linecap="round"/>
</g>

<text x="50" y="288" fill="#f2fbf6" font-family="Inter,Helvetica,Arial,sans-serif" font-size="56" font-weight="400">Hello Alex</text>

<!-- balance card -->
<rect x="40" y="330" width="520" height="164" rx="40" fill="url(#e-card)"/>
<text x="78" y="392" fill="#1a5741" font-family="Inter,Helvetica,Arial,sans-serif" font-size="27">Current Balance</text>
<text x="78" y="452" fill="#04241a" font-family="Inter,Helvetica,Arial,sans-serif" font-size="46" font-weight="600">$87,430.12</text>
<g font-family="Inter,Helvetica,Arial,sans-serif" font-size="25" fill="#0d7a45">
  <text x="410" y="452">↑ 10.2%</text>
</g>

<!-- actions -->
<rect x="40" y="528" width="252" height="80" rx="40" fill="url(#e-cta)"/>
<text x="166" y="577" fill="#03291a" font-family="Inter,Helvetica,Arial,sans-serif" font-size="29" font-weight="600" text-anchor="middle">Deposit</text>
<rect x="308" y="528" width="252" height="80" rx="40" fill="none" stroke="#7fd8ac" stroke-opacity=".6" stroke-width="3"/>
<text x="434" y="577" fill="#dff3e8" font-family="Inter,Helvetica,Arial,sans-serif" font-size="29" text-anchor="middle">Withdraw</text>

<!-- holdings -->
<g font-family="Inter,Helvetica,Arial,sans-serif">
  <text x="50" y="682" fill="#eaf7f0" font-size="32" font-weight="500">Holdings</text>
  <text x="550" y="682" fill="#8fd6b0" font-size="25" text-anchor="end">See all</text>
</g>

<g font-family="Inter,Helvetica,Arial,sans-serif">
  <!-- row 1 -->
  <circle cx="82" cy="758" r="29" fill="#0f3d2e" stroke="#3ddc8c" stroke-opacity=".35" stroke-width="2"/>
  <text x="82" y="768" fill="#7fe6b3" font-size="24" font-weight="600" text-anchor="middle">VD</text>
  <text x="130" y="750" fill="#e6f5ed" font-size="27" font-weight="500">VRDT</text>
  <text x="130" y="782" fill="#6fae92" font-size="21">Verdant</text>
  <path d="M300 772q22-26 42-8t34-26 40 6 36-22" fill="none" stroke="#3ddc8c" stroke-width="4" stroke-linecap="round" stroke-opacity=".85"/>
  <text x="550" y="752" fill="#e6f5ed" font-size="25" text-anchor="end">$41,208</text>
  <text x="550" y="782" fill="#3ddc8c" font-size="20" text-anchor="end">+6.4%</text>
  <!-- row 2 -->
  <circle cx="82" cy="874" r="29" fill="#122b3f" stroke="#5f9fe0" stroke-opacity=".35" stroke-width="2"/>
  <text x="82" y="884" fill="#9ec9f0" font-size="24" font-weight="600" text-anchor="middle">ET</text>
  <text x="130" y="866" fill="#e6f5ed" font-size="27" font-weight="500">ETH</text>
  <text x="130" y="898" fill="#6fae92" font-size="21">Ethereum</text>
  <path d="M300 884q26 18 44-6t36 14 40-24 36 8" fill="none" stroke="#5f9fe0" stroke-width="4" stroke-linecap="round" stroke-opacity=".8"/>
  <text x="550" y="868" fill="#e6f5ed" font-size="25" text-anchor="end">$28,940</text>
  <text x="550" y="898" fill="#3ddc8c" font-size="20" text-anchor="end">+2.1%</text>
  <!-- row 3 -->
  <circle cx="82" cy="990" r="29" fill="#3a2d10" stroke="#e8c765" stroke-opacity=".35" stroke-width="2"/>
  <text x="82" y="1000" fill="#f0d68e" font-size="24" font-weight="600" text-anchor="middle">BT</text>
  <text x="130" y="982" fill="#e6f5ed" font-size="27" font-weight="500">BTC</text>
  <text x="130" y="1014" fill="#6fae92" font-size="21">Bitcoin</text>
  <path d="M300 1004q24-30 44 0t36-18 40 20 36-16" fill="none" stroke="#e8c765" stroke-width="4" stroke-linecap="round" stroke-opacity=".75"/>
  <text x="550" y="984" fill="#e6f5ed" font-size="25" text-anchor="end">$17,282</text>
  <text x="550" y="1014" fill="#e8846b" font-size="20" text-anchor="end">-0.8%</text>
  <!-- row 4 -->
  <circle cx="82" cy="1106" r="29" fill="#0f3d2e" stroke="#3ddc8c" stroke-opacity=".3" stroke-width="2"/>
  <text x="82" y="1116" fill="#7fe6b3" font-size="24" font-weight="600" text-anchor="middle">SL</text>
  <text x="130" y="1098" fill="#e6f5ed" font-size="27" font-weight="500">SOL</text>
  <text x="130" y="1130" fill="#6fae92" font-size="21">Solana</text>
  <path d="M300 1118q22 14 44-10t36 18 40-20 36 10" fill="none" stroke="#3ddc8c" stroke-width="4" stroke-linecap="round" stroke-opacity=".7"/>
  <text x="550" y="1100" fill="#e6f5ed" font-size="25" text-anchor="end">$9,116</text>
  <text x="550" y="1130" fill="#3ddc8c" font-size="20" text-anchor="end">+4.7%</text>
</g>

<rect y="1090" width="600" height="214" fill="url(#e-fade)"/>
<rect x="222" y="1258" width="156" height="9" rx="4" fill="#dff3e8" opacity=".55"/>
</svg>
